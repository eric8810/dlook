name: release

# 只在推送 v* 标签时触发，构建 release binary 并发布到 GitHub Release。
# 不做 lint/test 等额外验证 —— 只打包，保证发版顺畅。
# 平台：Linux x86_64 + macOS x86_64/aarch64（Windows 见下方注释）。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          # Windows 暂时移出矩阵（v0.5.0）：视频会话基于 Unix domain socket，
          # 尚未实现 Windows 版本；代码已用 cfg(unix) 收敛，但发布产物暂不含
          # Windows。恢复时把下面三行加回矩阵，并确认 CI 能构建 ring（需 MSVC 工具链）。
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux 音频（cpal/rodio）需要 ALSA 开发库：cpal 在 Linux 上链接 libasound，
      # 缺 pkg-config + libasound2-dev 会直接构建失败（v0.5.0 首次发版即如此）。
      # macOS/Windows 用系统音频 API，无需额外依赖。
      - name: Install ALSA dev libraries (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
        working-directory: rs

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd rs/target/${{ matrix.target }}/release
          tar czf ../../../dlook-${{ matrix.target }}.tar.gz dlook

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "rs/target/${{ matrix.target }}/release/dlook.exe" -DestinationPath "rs/dlook-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dlook-${{ matrix.target }}
          path: rs/dlook-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: publish to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
